[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "edtt-definer"
version = "0.3.0"
description = "An unofficial Windows time-trial definition editor for EDCoPilot"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.13"
dependencies = [
    "PySide6==6.11.2",
]

[project.optional-dependencies]
dev = [
    "pytest==9.1.1",
    "pytest-qt==4.5.0",
    "pyinstaller==6.22.2",
]

[project.scripts]
edtt-definer = "edtt_definer.app:main"

[project.urls]
Homepage = "https://github.com/LouisH99/EDTT-Definer"
Repository = "https://github.com/LouisH99/EDTT-Definer"
Issues = "https://github.com/LouisH99/EDTT-Definer/issues"
Releases = "https://github.com/LouisH99/EDTT-Definer/releases"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
qt_api = "pyside6"
